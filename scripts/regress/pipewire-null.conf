# A PipeWire graph with no hardware in it, for the scenario legs: a stereo
# output that discards what it is sent and a stereo input that delivers
# silence, both clocked by the system timer. scripts/regress/null-audio.sh
# runs it as a private daemon.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    link.max-buffers = 16
    settings.check-quantum = true
    settings.check-rate    = true
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt     = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11 rt.prio = 70 }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata
      args = {
          metadata.name = default
          metadata.values = [
              { key = default.audio.sink   value = { name = dusk-null-output } }
              { key = default.audio.source value = { name = dusk-null-input } }
          ]
      } }
    { factory = spa-node-factory
      args = {
          factory.name    = support.node.driver
          node.name       = Dummy-Driver
          node.group      = pipewire.dummy
          priority.driver = 20000
      } }
    { factory = spa-node-factory
      args = {
          factory.name    = support.node.driver
          node.name       = Freewheel-Driver
          priority.driver = 19000
          node.group      = pipewire.freewheel
          node.freewheel  = true
      } }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = dusk-null-output
          node.description = "Null output"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          object.linger    = true
          adapter.auto-port-config = { mode = dsp monitor = false control = false position = preserve }
      } }
    # The input is another null sink whose monitor ports are its capture side:
    # nothing plays into it, so they carry silence.
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = dusk-null-input
          node.description = "Null input"
          media.class      = Audio/Source
          audio.position   = [ FL FR ]
          object.linger    = true
          adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
      } }
]
