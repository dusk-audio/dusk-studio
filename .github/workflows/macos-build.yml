name: macOS build

# Public test CI for macOS: compiles Release + runs the Catch2 suite. No
# signing, no secrets, NO artifact upload — same no-free-binaries policy
# as the Linux job. Its job is to catch macOS build/test breakage on
# every push so a release tag isn't the first time the code compiles on
# Mac. Unsigned release builds are produced by release.yml.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

# PR runs group by repository PR number, so a newer push supersedes only that
# PR (fork branches sharing a name can't collide on it). Push and dispatch
# runs get a run-id group of one: any shared key lets Actions drop a pending
# run regardless of cancel-in-progress, costing a landed commit its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gh cache delete in the prune steps needs actions: write; everything else
# only reads the checkout.
permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build + tests (clang Release, macOS arm64)
    runs-on: macos-14
    env:
      # CMakeLists.txt auto-detects ccache (find_program -> sets
      # CMAKE_CXX_COMPILER_LAUNCHER), so just installing it + caching its
      # dir across runs is enough — no CMake change. Stable dir for the
      # actions/cache key below.
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout Dusk Studio (with sfizz submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Test CI never pushes — don't leave the token in git config.
          persist-credentials: false

      - name: Install build dependencies
        # Ninja: parallel, low-overhead generator (much faster than the
        # default Makefiles on this many TUs). ccache: object cache that
        # survives across runs via the actions/cache step below, so an
        # unchanged TU isn't recompiled on the next push.
        # lame: libmp3lame for MP3 bounce/export (CMake auto-detects it).
        run: brew install ninja ccache lame libsndfile lilv suil lv2

      - name: Build static libsodium (pinned)
        # Homebrew's bottle is built for the runner OS, newer than the app's
        # macOS 11 deployment target. Build the audited source at that target
        # instead, and keep the app free of a Homebrew dylib dependency.
        env:
          SODIUM_VERSION: 1.0.22
          SODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/libsodium-${SODIUM_VERSION}.tar.gz"
          source_dir="${RUNNER_TEMP}/libsodium-source"
          prefix="${RUNNER_TEMP}/libsodium"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/jedisct1/libsodium/releases/download/${SODIUM_VERSION}-RELEASE/libsodium-${SODIUM_VERSION}.tar.gz"
          echo "${SODIUM_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "${source_dir}"
          tar -xzf "${archive}" -C "${source_dir}" --strip-components=1
          cd "${source_dir}"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          ./configure \
            --prefix="${prefix}" --disable-shared --enable-static
          # Keep this small autotools build aligned with the three-core runner.
          make -j3 check
          make install

      - name: Restore ccache objects
        # Restore on every run, save only from main (below): a snapshot per PR
        # push filled the repository's 10 GB cache quota within hours and
        # evicted the snapshots the next run needed.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-14-${{ github.sha }}
          restore-keys: |
            ccache-macos-14-

      - name: Clone JUCE 8.0.4 (upstream)
        run: |
          git clone --depth 1 --branch 8.0.4 \
            https://github.com/juce-framework/JUCE.git \
            "${RUNNER_TEMP}/JUCE"

      - name: Clone Dusk plugins
        uses: ./.github/actions/clone-donor

      - name: Clone DAF main
        uses: ./.github/actions/clone-daf-stack

      - name: Configure (Release)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DDUSKSTUDIO_SODIUM_ROOT="${RUNNER_TEMP}/libsodium" \
            -DJUCE_PATH="${RUNNER_TEMP}/JUCE" \
            -DDUSK_PLUGINS_PATH="${RUNNER_TEMP}/plugins" \
            -DDAF_PATH="${RUNNER_TEMP}/DAF" \
            -DDUSKSTUDIO_NATIVE_CLAP=ON \
            -DDUSKSTUDIO_NATIVE_LV2=ON \
            -DDUSKSTUDIO_NATIVE_VST3=ON
          for option in DUSKSTUDIO_NATIVE_CLAP DUSKSTUDIO_NATIVE_LV2 DUSKSTUDIO_NATIVE_VST3; do
            grep -q "^${option}:BOOL=ON$" build/CMakeCache.txt || {
              echo "::error::${option} was not enabled in the app configure" >&2; exit 1; }
          done
          grep -Eq '^DUSKSTUDIO_SODIUM_STATIC_LIBRARY:FILEPATH=.*/libsodium\.a$' build/CMakeCache.txt || {
            echo "::error::macOS app configure did not select static libsodium" >&2; exit 1; }

      - name: Build (Release)
        # Preserve Ninja's five-worker default on this three-core runner,
        # but keep the limit explicit so generator changes cannot unbound it.
        run: cmake --build build -j5

      - name: Verify macOS 11 sandbox helper
        run: |
          set -euo pipefail
          app="build/DuskStudio_artefacts/Release/DuskStudio.app/Contents/MacOS"
          for binary in "$app/DuskStudio" "$app/dusk-studio-plugin-host"; do
            [[ -x "$binary" ]] || {
              echo "::error::missing executable: $binary" >&2; exit 1; }
            otool -l "$binary" | grep -E 'minos +11\.0' >/dev/null || {
              echo "::error::$binary does not target macOS 11.0" >&2; exit 1; }
          done

      - name: Smoke launch (--version)
        run: build/DuskStudio_artefacts/Release/DuskStudio.app/Contents/MacOS/DuskStudio --version

      - name: Headless self-test (DUSKSTUDIO_RUN_SELFTEST=1)
        # Same coverage as the Linux job: full AudioEngine construction, plugin
        # scan attempt, synthetic DSP. The runner has no GNU timeout, so the
        # bound is perl's alarm, which survives the exec. 90 s because there is
        # no audio device and the readiness wait burns its budget first.
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 90 \
            env DUSKSTUDIO_RUN_SELFTEST=1 \
            build/DuskStudio_artefacts/Release/DuskStudio.app/Contents/MacOS/DuskStudio

      - name: Configure + build + run tests
        run: |
          set -euo pipefail
          cmake -S . -B build-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DDUSKSTUDIO_SODIUM_ROOT="${RUNNER_TEMP}/libsodium" \
            -DDUSKSTUDIO_BUILD_TESTS=ON \
            -DJUCE_PATH="${RUNNER_TEMP}/JUCE" \
            -DDUSK_PLUGINS_PATH="${RUNNER_TEMP}/plugins" \
            -DDAF_PATH="${RUNNER_TEMP}/DAF" \
            -DDUSKSTUDIO_NATIVE_CLAP=ON \
            -DDUSKSTUDIO_NATIVE_LV2=ON \
            -DDUSKSTUDIO_NATIVE_VST3=ON
          for option in DUSKSTUDIO_NATIVE_CLAP DUSKSTUDIO_NATIVE_LV2 DUSKSTUDIO_NATIVE_VST3; do
            grep -q "^${option}:BOOL=ON$" build-tests/CMakeCache.txt || {
              echo "::error::${option} was not enabled in the test configure" >&2; exit 1; }
          done
          grep -Eq '^DUSKSTUDIO_SODIUM_STATIC_LIBRARY:FILEPATH=.*/libsodium\.a$' build-tests/CMakeCache.txt || {
            echo "::error::macOS test configure did not select static libsodium" >&2; exit 1; }
          cmake --build build-tests --target dusk-studio-tests -j5
          ctest --test-dir build-tests --output-on-failure --parallel 3

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache objects (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-14-${{ github.sha }}

      - name: Prune older ccache snapshots (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key ccache-macos-14- \
              --sort created_at --order desc --limit 100 --json id \
            | jq -r '.[1:][].id' \
            | while IFS= read -r id; do
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done
