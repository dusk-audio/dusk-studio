name: Windows tests

# Builds the app and runs the Catch2 test binary on Windows so Windows-only
# app sources plus the cross-platform IPC stub round-trip and other
# Windows-relevant tests are exercised on every PR. Distinct from
# release.yml, whose Windows job packages +
# publish the signed MSI to the private releases repo. Bundling tests into the
# release-packaging workflow would mean tests run once per ship, not per PR —
# which defeats the regression-net purpose.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# PR runs group by repository PR number, so a newer push supersedes only that
# PR (fork branches sharing a name can't collide on it). Push and dispatch
# runs get a run-id group of one: any shared key lets Actions drop a pending
# run regardless of cancel-in-progress, costing a landed commit its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # Runner-agnostic name on purpose: the required-status-check context in the
    # branch ruleset matches this string, so it must NOT carry the runner image
    # version. Re-pinning runs-on below (when an image is retired) then never
    # renames the check and silently breaks the gate.
    name: Catch2 tests (MSVC x64 Release, Windows)
    # Pinned to windows-2022: windows-latest migrated to windows-2025, whose
    # image no longer resolves the "Visual Studio 17 2022" CMake generator.
    runs-on: windows-2022

    steps:
      - name: Checkout Dusk Studio
        uses: actions/checkout@v7
        with:
          # external/sfizz is a submodule; without recursive checkout the
          # CMake configure step fails ("external/sfizz/src/sfizz.h not
          # found"). Nested sfizz deps (abseil, st_audiofile) also need
          # to be present for the static link to succeed.
          submodules: recursive
          persist-credentials: false

      - name: Clone JUCE 8.0.4
        shell: bash
        run: |
          git clone --depth 1 --branch 8.0.4 \
            https://github.com/juce-framework/JUCE.git \
            "${RUNNER_TEMP}/JUCE"

      - name: Clone Dusk plugins (donor DSP, pinned)
        # Pinned donor SHA (mirrors release.yml). main consumes source
        # files the donor's main HEAD has since relocated, so an unpinned
        # clone breaks configure. Bump every workflow's DONOR_REV together.
        shell: bash
        env:
          DONOR_REPO: https://github.com/dusk-audio/dusk-audio-plugins.git
          DONOR_REV: 0a1b17f8e9dbecd26bf78dd45704c6c149e4b2ea
        run: |
          set -euo pipefail
          git init -q "${RUNNER_TEMP}/plugins"
          cd "${RUNNER_TEMP}/plugins"
          git remote add origin "${DONOR_REPO}"
          git fetch --depth 1 origin "${DONOR_REV}"
          git checkout -q "${DONOR_REV}"
          [[ "$(git rev-parse HEAD)" == "${DONOR_REV}" ]] || {
            echo "ERROR: donor checkout $(git rev-parse HEAD) != pinned ${DONOR_REV}" >&2; exit 1; }

      - name: Clone DAF stack (dusk-audio forks, pinned)
        # Pins + rationale live in .github/actions/clone-daf-stack.
        uses: ./.github/actions/clone-daf-stack

      - name: Fetch Steinberg ASIO SDK
        # The app target requires ASIO on Windows. Use the same fetch as
        # release.yml so PR CI compiles the release audio-device path.
        shell: bash
        run: |
          curl -sSL -o "${RUNNER_TEMP}/asiosdk.zip" https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip
          7z x -y "${RUNNER_TEMP}/asiosdk.zip" -o"${RUNNER_TEMP}/asiosdk-extract" > /dev/null
          inner_dirs=("${RUNNER_TEMP}"/asiosdk-extract/asiosdk_*/)
          if (( ${#inner_dirs[@]} != 1 )) || [ ! -d "${inner_dirs[0]}" ]; then
              echo "ASIO SDK extract: expected exactly one asiosdk_* directory, got ${#inner_dirs[@]}" >&2
              ls -la "${RUNNER_TEMP}/asiosdk-extract" >&2 || true
              exit 1
          fi
          mv "${inner_dirs[0]}"/* "${RUNNER_TEMP}/asiosdk-extract/"
          rmdir "${inner_dirs[0]}" || true
          if [ ! -f "${RUNNER_TEMP}/asiosdk-extract/common/iasiodrv.h" ]; then
              echo "ASIO SDK extract: missing common/iasiodrv.h after move" >&2
              exit 1
          fi
          echo "ASIOSDK_PATH=${RUNNER_TEMP}/asiosdk-extract" >> "$GITHUB_ENV"

      - name: Install libmp3lame + libsndfile (vcpkg)
        shell: bash
        # x64-windows-static = static libs + /MT static CRT, matching the whole
        # tree's CMAKE_MSVC_RUNTIME_LIBRARY (sfizz forces /MT). The -md triplet
        # (/MD) would LNK2038 against the /MT objects. CMake finds them via
        # CMAKE_PREFIX_PATH. Manifest mode: versions come from vcpkg.json's
        # builtin-baseline and install under <manifest-root>/vcpkg_installed,
        # not the image's vcpkg tree. That baseline tracks the runner image's
        # own vcpkg clone commit: vcpkg cannot fetch a baseline it does not
        # already have, so never bump it past what the current image ships.
        run: |
          vcpkg install --triplet x64-windows-static
          echo "VCPKG_PREFIX=${GITHUB_WORKSPACE//\\//}/vcpkg_installed/x64-windows-static" >> "$GITHUB_ENV"

      - name: Configure tests (CMake / Visual Studio 17 2022 / x64)
        shell: bash
        run: |
          # DAF's cmake re-parses these paths, so backslashes from RUNNER_TEMP
          # become invalid \-escapes there; hand it forward slashes (same
          # conversion the vcpkg prefix uses above).
          RT_UNIX="${RUNNER_TEMP//\\//}"
          cmake -S . -B build-tests \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUSKSTUDIO_BUILD_TESTS=ON \
            -DJUCE_PATH="${RUNNER_TEMP}/JUCE" \
            -DDUSK_PLUGINS_PATH="${RUNNER_TEMP}/plugins" \
            -DDAF_PATH="${RT_UNIX}/DAF" \
            -DDAF_WIDGETS_PATH="${RT_UNIX}/DAF-Widgets" \
            -DASIOSDK_PATH="${ASIOSDK_PATH}" \
            -DCMAKE_PREFIX_PATH="${VCPKG_PREFIX}" \
            -DDUSKSTUDIO_NATIVE_CLAP=ON \
            -DDUSKSTUDIO_NATIVE_VST3=ON
          for option in DUSKSTUDIO_NATIVE_CLAP DUSKSTUDIO_NATIVE_VST3; do
            grep -q "^${option}:BOOL=ON$" build-tests/CMakeCache.txt || {
              echo "::error::${option} was not enabled in the test configure" >&2; exit 1; }
          done

      - name: Build app and test binary
        # Building DuskStudio covers Windows-only app sources such as the
        # native CLAP/VST3 editors and pulls dusk_native_ui transitively. The
        # Catch2 target also depends on dusk-studio-plugin-host and resolves
        # that child beside the test executable through its configured path.
        shell: bash
        run: cmake --build build-tests --config Release --target DuskStudio dusk-studio-tests -j4

      - name: Run tests
        # Full Catch2 suite on MSVC. FileImporter fixtures close their writers
        # before import/readback, while a deterministic unit covers the bounded
        # retry used for transient Defender/indexer locks.
        #
        # Loopback / firewall: the Windows IPC layer uses named pipes
        # (\\.\pipe\dusk-studio-ipc-*) + CreateFileMapping + kernel events.
        # None of those traverse a network adapter, so no firewall
        # exception is needed. GitHub-hosted windows-latest runners
        # permit anonymous named-pipe IPC inside the runner session
        # without elevation.
        shell: bash
        run: |
          inventory="$(ctest --test-dir build-tests -N -C Release)"
          printf '%s\n' "$inventory"
          for required in \
            "ipc-stub: connect, round-trip 32 blocks, byte-exact echo" \
            "ipc-stub: rejects oversize block" \
            "ipc-stub: timeout is bounded and marks the connection crashed" \
            "ipc-stub: repeated connect, block, and teardown"; do
            grep -Fq "$required" <<< "$inventory" || {
              echo "::error::required Windows IPC regression missing from CTest: $required" >&2
              exit 1
            }
          done
          for required in \
            "FileImporter: transient file locks retry but remain bounded" \
            "FileImporter: 44.1k mono -> 48k session preserves length" \
            "FileImporter: 44.1k -> 48k upsample fills the tail with audio, not a held sample" \
            "FileImporter: 96k mono -> 48k session preserves length" \
            "FileImporter: stereo -> mono sums L+R at 0.5 each" \
            "FileImporter: mono -> stereo duplicates to L and R" \
            "FileImporter: matching rate and channels copies the source verbatim" \
            "FileImporter: a matching 32-bit source is not truncated to 24-bit"; do
            grep -Fq "$required" <<< "$inventory" || {
              echo "::error::required Windows FileImporter regression missing from CTest: $required" >&2
              exit 1
            }
          done
          ctest --test-dir build-tests --output-on-failure -C Release
