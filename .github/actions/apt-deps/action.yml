name: Install apt packages
description: >
  Hardened apt-get update + install: timeout(1) around every apt
  invocation (Acquire timeouts alone cannot stop a byte-dribbling mirror,
  which is how a "retried" install still sat stuck for 70+ minutes),
  three attempts, and a bounded dpkg --configure -a before each retry so
  a timed-out install cannot wedge the rest. Stock Ubuntu repos only by
  policy: azure's mirror is purged up front from every mirror file,
  including the hosted runners' /etc/apt/apt-mirrors.txt mirrorlist;
  arm64 keeps IPv4 forced for ports.ubuntu.com. Logic lives in
  apt_install.sh next to this file.
inputs:
  packages:
    description: Space-separated apt package list
    required: true
runs:
  using: composite
  steps:
    - name: apt-get with timeouts, retries, and mirror switching
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/apt_install.sh" ${{ inputs.packages }}'
