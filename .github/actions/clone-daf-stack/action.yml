name: Clone DAF
description: DAF checkout into RUNNER_TEMP for the native UI at the commit in DAF_REV.

runs:
  using: composite
  steps:
    - name: Clone DAF
      shell: bash
      env:
        DAF_REPO: https://github.com/dusk-audio/DAF.git
      run: |
        set -euo pipefail
        rev="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/DAF_REV")"
        [[ "${rev}" =~ ^[0-9a-f]{40}$ ]] || {
          echo "ERROR: DAF_REV must hold one full commit hash (got '${rev}')" >&2; exit 1; }
        git init -q "${RUNNER_TEMP}/DAF"
        cd "${RUNNER_TEMP}/DAF"
        git remote add origin "${DAF_REPO}"
        git fetch --depth 1 origin "${rev}"
        git checkout -q FETCH_HEAD
        [[ "$(git rev-parse HEAD)" == "${rev}" ]] || {
          echo "ERROR: DAF checkout $(git rev-parse HEAD) != DAF_REV ${rev}" >&2; exit 1; }
        echo "DAF ${rev}"
        # LICENSES.txt ships in every package and must name the DAF commit
        # that was compiled in.
        licenses="${GITHUB_WORKSPACE}/LICENSES.txt"
        sed "s/@DAF_REV@/${rev}/g" "${licenses}" > "${licenses}.tmp"
        mv "${licenses}.tmp" "${licenses}"
